name: C Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc make

    - name: Build with Make
      run: make

    - name: Run the program with test input
      run: |
        cat > test_input.txt << 'EOF'
        Иванов И.И.
        1234567
        2000 1 15
        Петров П.П.
        7654321
        1995 5 20
        Сидоров С.С.
        5551234
        1988 10 30
        Козлов К.К.
        3334445
        1985 7 12
        Смирнов С.С.
        7778889
        1998 12 5
        Васильев В.В.
        9990001
        1979 9 18
        Николаев Н.Н.
        4445556
        1992 3 25
        Иванов
        EOF
        
        cat test_input.txt
        if [ -f "./note2_program" ]; then
          chmod +x ./note2_program
          ./note2_program < test_input.txt
        else
          echo "Ошибка: файл ./note2_program не найден!"
          ls -la
          exit 1
        fi
